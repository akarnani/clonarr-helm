name: validate

on:
  pull_request:
    paths:
      - "Chart.yaml"
      - "values.yaml"
      - "templates/**"
      - ".github/workflows/validate.yaml"
  push:
    branches: [main]

jobs:
  lint-and-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: helm lint
        run: helm lint .

      - name: helm template (default values)
        run: helm template test . > /tmp/rendered.yaml

      - name: helm template (ingress enabled)
        run: |
          helm template test . \
            --set ingress.enabled=true \
            --set ingress.hosts[0].host=clonarr.example.com \
            --set ingress.hosts[0].paths[0].path=/ \
            --set ingress.hosts[0].paths[0].pathType=Prefix \
            > /tmp/rendered-ingress.yaml

      - name: helm template (tailscaleIngress enabled)
        run: |
          helm template test . \
            --set tailscaleIngress.enabled=true \
            --set tailscaleIngress.hostname=clonarr \
            > /tmp/rendered-tailscale.yaml

      - name: helm template (both ingresses set — must fail)
        run: |
          if helm template test . \
              --set ingress.enabled=true \
              --set tailscaleIngress.enabled=true \
              > /dev/null 2>&1; then
            echo "Expected mutual-exclusion fail, but template succeeded"
            exit 1
          fi

      - name: Validate rendered manifests with kubeconform
        uses: docker://ghcr.io/yannh/kubeconform:latest
        with:
          args: -strict -summary -ignore-missing-schemas /tmp/rendered.yaml /tmp/rendered-ingress.yaml /tmp/rendered-tailscale.yaml
