image:
  repository: ghcr.io/prophetse7en/clonarr
  # Pin by multi-arch manifest list digest. The registry serves the right
  # per-arch image (amd64 or arm64) automatically based on the node's arch.
  # Look up with:
  #   docker buildx imagetools inspect ghcr.io/prophetse7en/clonarr:<tag>
  # This digest corresponds to the "latest" tag as of 2026-05-21.
  # To use a tag instead, set digest to "".
  tag: "latest"
  digest: "sha256:7541c15ad2400553e03ed2897ac79affb20bb622e9d2d8c296581c8ff0bd729b"
  pullPolicy: IfNotPresent

env:
  TZ: "America/New_York"
  PUID: "1000"
  PGID: "1000"
  # URL_BASE: "/clonarr"
  # TRUSTED_NETWORKS: ""
  # TRUSTED_PROXIES: ""

service:
  type: ClusterIP
  port: 6060

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: clonarr.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Convenience preset for the Tailscale Kubernetes operator's Ingress mode.
# When enabled, renders an Ingress with ingressClassName: tailscale,
# TLS via Tailscale's MagicDNS cert, and (optionally) HTTP -> HTTPS redirect.
# Mutually exclusive with `ingress.enabled` above.
tailscaleIngress:
  enabled: false
  # The first DNS label of your tailnet hostname.
  # Becomes <hostname>.<tailnet>.ts.net
  hostname: clonarr
  # Requires Tailscale operator v1.92.0+ (Dec 2025).
  httpRedirect: true

persistence:
  # hostPath mount so config lands on the macOS filesystem for Time Machine backup
  hostPath: /Users/Shared/clonarr-config
  # Path inside the container
  mountPath: /config

# On Rancher Desktop (macOS), host.docker.internal resolves to the host.
# Use this when Radarr/Sonarr run as native macOS apps.
hostNetwork:
  # If you need the pod on the host network instead of using DNS, set to true
  enabled: false

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}
